name: Feature wish
description: An idea for something the addon could do or do better.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for your idea! Fill in what you can – a short description is enough. Please keep it friendly and on topic ([Code of Conduct](https://github.com/Jazzman1976/Forever-Hunter-Pets/blob/develop/CODE_OF_CONDUCT.md)).
  - type: textarea
    id: what
    attributes:
      label: What would you like?
      description: What should the addon do, and in which view or situation?
  - type: textarea
    id: why
    attributes:
      label: Why would it help you?
      description: What are you trying to do in the game, and what is hard about it today?
  - type: textarea
    id: more
    attributes:
      label: Anything else?
      description: Screenshots, sketches, examples.
