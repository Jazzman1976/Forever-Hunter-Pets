name: Bug report
description: Something in the addon does not work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Fill in what you can – a short description is enough. Please keep it friendly and on topic ([Code of Conduct](https://github.com/Jazzman1976/Forever-Hunter-Pets/blob/develop/CODE_OF_CONDUCT.md)).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
  - type: input
    id: version
    attributes:
      label: Addon version
      description: Shown in chat when you log in, e.g. 0.8.0.
  - type: input
    id: language
    attributes:
      label: Client language
      placeholder: e.g. English, German
  - type: textarea
    id: more
    attributes:
      label: Anything else?
      description: Error messages, screenshots, other addons that might be involved.
