name: Data finding
description: A beast teaches something else, lives somewhere else, or a cost or level is wrong.
labels: [data]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping the catalogue! Fill in what you can – a short description is enough. Please only report what you saw in the game yourself, not data from websites or other addons. Keep it friendly and on topic ([Code of Conduct](https://github.com/Jazzman1976/Forever-Hunter-Pets/blob/develop/CODE_OF_CONDUCT.md)).
  - type: textarea
    id: what
    attributes:
      label: What did you see in the game?
      description: For example "the Grey Fox at level 22 taught me Cower rank 1" or "Swipe rank 1 costs 5 TP".
  - type: input
    id: beast
    attributes:
      label: Beast, ability and rank
      description: The NPC ID helps if you know it.
  - type: input
    id: version
    attributes:
      label: Addon version and client language
      placeholder: e.g. 0.8.0, English
